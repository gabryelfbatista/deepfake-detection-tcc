# CNN K-Fold Configuration — EfficientNet-B0 with Stratified K-Fold

model:
  backbone: "efficientnet_b0"
  pretrained: true            # ImageNet weights
  num_classes: 3              # REAL, SYNTHETIC, TAMPERED

training:
  epochs: 10
  batch_size: 256
  learning_rate: 8.0e-4
  weight_decay: 0.01
  lr_scheduler: "cosine"
  img_size: 224

augmentation:
  horizontal_flip: true
  rotation: 10
  color_jitter:
    brightness: 0.2
    contrast: 0.2

dataset:
  id: "saberzl/SID_Set"
  local_path: "dataset/sid_set"
  max_train: null 

kfold:
  n_splits: 5
  shuffle: true
  seed: 42

output:
  dir: "experiments/cnn_kfold_02"
