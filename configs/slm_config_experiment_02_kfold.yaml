# Multimodal SLM K-Fold Configuration — Qwen3-VL-2B-Instruct
# References: Hu et al. (2021) — LoRA; Dettmers et al. (2023) — QLoRA
# Target hardware: 2x RTX 4090 (24GB) — QLoRA 4-bit + DDP via accelerate.

model:
  id: "Qwen/Qwen3-VL-2B-Instruct"
  dtype: "bfloat16"
  min_pixels: 3136    # 4 * 28 * 28
  max_pixels: 200704  # 256 * 28 * 28

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 2
  batch_size: 2                 # per device — 2x 4090 24GB
  grad_accumulation: 8          # effective batch = 2 * 2 GPUs * 8 = 32
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optimizer: "paged_adamw_8bit"
  max_seq_length: 512
  bf16: true
  gradient_checkpointing: true

dataset:
  id: "saberzl/SID_Set"
  local_path: "dataset/sid_set"
  max_train: 600               # null = use full train split (210k)
  eval_max_per_fold: 1500       # stratified subset for generation-based F1 per fold

kfold:
  n_splits: 2
  shuffle: true
  seed: 42

output:
  dir: "experiments/slm_kfold_02"
  save_total_limit: 1
  report_to: "none"
  save_adapters: true           # keep per-fold LoRA adapters
